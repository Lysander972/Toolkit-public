name: audit

on:
  workflow_call:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled, closed]

concurrency:
  group: audit-${{ ((github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'ready-to-merge') && github.run_id || github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    if: github.event.action != 'closed' && ((github.event.action != 'labeled' && github.event.action != 'unlabeled') || github.event.label.name == 'ready-to-merge')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: ${{ github.event_name == 'pull_request' && (github.event.pull_request.draft || !contains(github.event.pull_request.labels.*.name, 'ready-to-merge')) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          submodules: true
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: '0.11.8'
          enable-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm requirements:check
      - run: pnpm requirements:verify:head
      - if: github.event_name == 'pull_request' && !github.event.pull_request.draft && contains(github.event.pull_request.labels.*.name, 'ready-to-merge')
        run: git merge-base --is-ancestor origin/main HEAD
