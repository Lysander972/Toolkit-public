guidance = "阅读被审条目和关系两侧完整正文。评分必须给出具体理由；低于满分必须给出改进建议。不得以链接存在、命令通过或已填写文档替代内容检视。"

[[criterion]]
id = "parent_fit"
name = "与上游一致"
description = "目标、范围、条件与上游全文相符；没有断章取义、漏项、偷换概念或捏造授权。"
scoring_guide = "0：歪曲或遗漏影响目标的内容。1：总体一致，存在明确列出的局部缺口。2：完整对应，无已知缺口。"
max_score = 2

[[criterion]]
id = "reasoning"
name = "推导可追溯"
description = "出发点、角度、推导、结论和设计选择能够逐项回溯到依据。"
scoring_guide = "0：只有结论或理由与结论无关。1：推导成立，部分说明需完善。2：推导完整且明确区分原文要求与设计选择。"
max_score = 2

[[criterion]]
id = "evidence"
name = "证据与交付对应"
description = "主张有可核对的正文、实现或行为验证支持；计划没有冒充完成。"
scoring_guide = "0：无证据、虚构完成或存在反证。1：主要主张有证据，局部待补项明确列出。2：所有主张均有直接证据支持。"
max_score = 2
